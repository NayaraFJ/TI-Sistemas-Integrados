services:
  mysql:
    image: mysql:8.4
    container_name: sige-desk-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sige_desk
      MYSQL_USER: sige
      MYSQL_PASSWORD: sige_local
      MYSQL_ROOT_PASSWORD: root_local_only
    ports:
      - "3306:3306"
    volumes:
      - sige_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local_only"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sige_mysql_data:
