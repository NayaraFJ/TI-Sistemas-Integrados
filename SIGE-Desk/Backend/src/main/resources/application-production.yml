spring:
  datasource:
    url: ${SIGE_DB_URL}
    username: ${SIGE_DB_USERNAME}
    password: ${SIGE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      data-source-properties:
        createDatabaseIfNotExist: false
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
  tomcat:
    threads:
      max: 30
      min-spare: 2
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoint:
    health:
      show-details: never
sige:
  admin:
    password: ${SIGE_ADMIN_PASSWORD}
  demo:
    password: ${SIGE_DEMO_PASSWORD}
  cors:
    allowed-origin: ${SIGE_ALLOWED_ORIGIN}
