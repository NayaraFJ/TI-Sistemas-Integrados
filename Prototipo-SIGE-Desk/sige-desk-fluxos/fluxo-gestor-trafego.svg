<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de telas — Gestor de tráfego</title><desc id="desc">Caminho do Gestor de tráfego pelo SIGE Desk.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52616b"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#112d42}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#5f7280}.code{font-size:13px;font-weight:700;fill:#087ca7}.node{fill:#fff;stroke:#b7c6d0;stroke-width:2}.login{fill:#e7f4fb;stroke:#279ac5}.home{fill:#f0edff;stroke:#8a75de}.ticket{fill:#e8f8f5;stroke:#31a99b}.action{fill:#fff8e7;stroke:#e6a930}.edge{fill:none;stroke:#52616b;stroke-width:2;marker-end:url(#a)}.edgeLabel{font-size:13px;fill:#40515d}</style></defs>
  <rect width="1280" height="900" fill="#f7fafc"/><rect x="30" y="25" width="1220" height="850" rx="20" fill="#fff" stroke="#dce6ed"/><text x="70" y="82" class="title">Fluxo de telas — Gestor de tráfego</text><text x="70" y="110" class="sub">Execução de tickets atribuídos e registro de evidências</text>
  <path class="edge" d="M640 215V270"/><text x="662" y="245" class="edgeLabel">autenticar</text><path class="edge" d="M560 360C430 395 340 420 300 480"/><text x="385" y="405" class="edgeLabel">ver tickets atribuídos</text><path class="edge" d="M720 360C850 395 940 420 980 480"/><text x="840" y="405" class="edgeLabel">acompanhar retornos</text><path class="edge" d="M380 570C440 610 490 625 540 680"/><text x="420" y="620" class="edgeLabel">abrir ticket atribuído</text><path class="edge" d="M300 570C300 700 560 650 590 760"/><text x="315" y="690" class="edgeLabel">iniciar trabalho</text><path class="edge" d="M670 765C650 735 630 725 620 680"/><text x="682" y="735" class="edgeLabel">registrar entrega</text><path class="edge" d="M980 570C950 690 770 675 720 760"/><text x="820" y="670" class="edgeLabel">tratar atribuição ou correção</text>
  <rect class="node login" x="490" y="125" width="300" height="90" rx="14"/><text x="520" y="160" class="code">T01</text><text x="520" y="190" font-size="18">Acessar o ambiente</text><rect class="node home" x="490" y="270" width="300" height="90" rx="14"/><text x="520" y="305" class="code">T02</text><text x="520" y="335" font-size="20" font-weight="700">Visão geral</text><rect class="node ticket" x="190" y="480" width="220" height="90" rx="14"/><text x="215" y="515" class="code">T03</text><text x="215" y="545" font-size="18">Tickets</text><rect class="node ticket" x="870" y="480" width="220" height="90" rx="14"/><text x="895" y="515" class="code">T09</text><text x="895" y="545" font-size="18">Notificações</text><rect class="node ticket" x="510" y="680" width="260" height="85" rx="14"/><text x="535" y="715" class="code">T05</text><text x="535" y="745" font-size="18">Detalhe do ticket</text><rect class="node action" x="540" y="760" width="240" height="90" rx="14"/><text x="565" y="795" class="code">T07</text><text x="565" y="825" font-size="18">Execução</text>
</svg>
