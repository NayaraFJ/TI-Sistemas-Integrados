  <path class="edge" d="M700 860C670 830 640 810 610 720"/><text x="840" y="845" class="edgeLabel">aprovar ou corrigir</text>
  <rect class="node login" x="490" y="135" width="300" height="90" rx="14"/><text x="520" y="170" class="code">T01</text><text x="520" y="198" font-size="18">Acessar o ambiente</text>
  <rect class="node home" x="490" y="285" width="300" height="100" rx="14"/><text x="520" y="322" class="code">T02</text><text x="520" y="352" font-size="20" font-weight="700">Visão geral</text>
  <rect class="node ticket" x="120" y="475" width="220" height="90" rx="14"/><text x="145" y="510" class="code">T03</text><text x="145" y="540" font-size="18">Tickets</text>
  <rect class="node action" x="530" y="475" width="220" height="90" rx="14"/><text x="555" y="510" class="code">T04</text><text x="555" y="540" font-size="18">Novo ticket</text>
  <rect class="node ticket" x="940" y="475" width="220" height="90" rx="14"/><text x="965" y="510" class="code">T09</text><text x="965" y="540" font-size="18">Notificações</text>
  <rect class="node ticket" x="510" y="635" width="260" height="85" rx="14"/><text x="535" y="670" class="code">T05</text><text x="535" y="700" font-size="18">Detalhe do ticket</text>
