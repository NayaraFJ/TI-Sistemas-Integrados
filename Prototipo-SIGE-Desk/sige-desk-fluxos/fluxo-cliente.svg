<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 930" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de telas — Cliente</title><desc id="desc">Caminho do Cliente pelo SIGE Desk.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52616b"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#112d42}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#5f7280}.code{font-size:13px;font-weight:700;fill:#087ca7}.node{fill:#fff;stroke:#b7c6d0;stroke-width:2}.login{fill:#e7f4fb;stroke:#279ac5}.home{fill:#f0edff;stroke:#8a75de}.ticket{fill:#e8f8f5;stroke:#31a99b}.action{fill:#fff8e7;stroke:#e6a930}.edge{fill:none;stroke:#52616b;stroke-width:2;marker-end:url(#a)}.edgeLabel{font-size:13px;fill:#40515d}.legend{font-size:12px;fill:#5f7280}</style></defs>
  <rect width="1280" height="930" fill="#f7fafc"/><rect x="30" y="25" width="1220" height="880" rx="20" fill="#fff" stroke="#dce6ed"/>
